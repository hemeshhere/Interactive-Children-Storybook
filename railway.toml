[environment]
NIXPACKS_PROVIDERS = "php,node"
NPM_CONFIG_LEGACY_PEER_DEPS = "true"

[build]
builder = "nixpacks"
buildCommand = "composer install --optimize-autoloader --no-interaction && npm install && npm run build"

[deploy]
startCommand = "php artisan config:cache && php artisan route:cache && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"